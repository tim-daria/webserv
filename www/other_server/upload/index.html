<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webserv | Upload File</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <script src="/assets/theme.js"></script>
</head>
<body>

    <header>
      <a href="/">Webserv</a>
      <button class="toggle" onclick="toggleTheme(this)" aria-label="Toggle theme">Make it wild 💖</button>
    </header>

    <main>
        <section class="hero">
            <h1>Upload a File</h1>
            <p class="secondaryText">Sends a POST request with <code>multipart/form-data</code> body.</p>
        </section>

				<section class="listFiles">
					<h2>Files in /uploads/</h2>
					<ul id="file-list"><li class="empty">Loading...</li></ul>
        </section>

        <div class="form-card">
            <h2>File Upload</h2>
            <p class="desc">Choose a file below and click Upload. The server will write it to the <code>/uploads/</code> directory.</p>

            <form method="POST" action="/upload" enctype="multipart/form-data">
                <div class="form-group">
                    <!-- <label for="file">File</label> -->
                    <input type="file" id="file" name="file" required>
                </div>
                <button type="submit" class="btn">Upload File</button>
            </form>
            <div id="result"></div>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 42 School Project &mdash; Nikolai Efimov, Tanya Semenova, Daria Timofeeva</p>
    </footer>
<script src="/assets/files.js"></script>
</body>
</html>
