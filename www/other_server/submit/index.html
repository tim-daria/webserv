<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webserv | Submit Form</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <script src="/assets/theme.js"></script>
</head>
<body>

    <header>
      <a href="/">Webserv</a>
      <button class="toggle" onclick="toggleTheme(this)" aria-label="Toggle theme">Make it wild 💖</button>
    </header>

    <main>
        <section class="hero">
            <h1>Submit a Form</h1>
            <p class="secondaryText">Sends a POST request with <code>application/x-www-form-urlencoded</code> body.</p>
        </section>

        <div class="form-card">
            <h2>Contact Form</h2>
            <p class="desc">Fill in the fields below and submit. We will never contact you.</p>

            <form id="contact-form" method="POST" action="/submit">
                <div class="form-group">
                    <!-- <label for="name">Name</label> -->
                    <input type="text" id="name" name="name" placeholder="Name" required>
                </div>
                <div class="form-group">
                    <!-- <label for="email">Email</label> -->
                    <input type="email" id="email" name="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <!-- <label for="message">Message</label> -->
                    <textarea id="message" name="message" placeholder="Say hello!" required></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
            <div id="result"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 42 School Project &mdash; Nikolai Efimov, Tanya Semenova, Daria Timofeeva</p>
    </footer>

<script src="/assets/files.js"></script>
</body>
</html>
